<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Onlline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/data.js"></script>
</head>
<body>
    <header class="header">
        <section class="logo">
            <img src="./images/elLogo.jpg" alt="logo">
        </section>
        <section class="search">
            <input class="js-searchInput" type="text" id="search" placeholder="Buscar producto...">
            <button class="js-search"><i class="fa-solid fa-magnifying-glass"></i>Buscar</button>
        </section>
        <section>
            <ul class="menu">
                <li ><a href="" class="user"><i class="fa-solid fa-user"></i>Iniciar sesión</a></li>
                <li>Ayuda</li>
                <li ><a href="" class="carrito js-carrito-icono"><i class="fa-solid fa-cart-shopping"></i>Carrito<span class="numero">(0)</span></a></li>
            </ul>
        </section>
    </header>
    <main>
        <section class="hidden js-carrito">
            <ul>
                <li>Producto</li>
                <li>Precio</li>
                <li>Cantidad</li>
                <li>Total</li>
            </ul>
            <section class="js-productosCarrito"></section>
            <section class="totalCarrito">
                <p class="js-total">Total: </p>
                <button class="js-vaciar">Vaciar carrito</button>
                <button class="comprar">Comprar</button>
            </section>
        </section>
        <div class="grid js-productos">
            
        </div>
    </main>
    <footer>
        <h5>Encuentranos en</h5>
        <ul class="redes">
            <li><i class="fa-brands fa-facebook"></i></li>
            <li><i class="fa-brands fa-instagram"></i></li>
            <li><i class="fa-brands fa-twitter"></i></li>
        </ul>
    </footer>
    
    <script src="./JS/script.js"></script>
</body>
</html>
